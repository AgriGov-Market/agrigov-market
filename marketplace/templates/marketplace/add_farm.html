{% extends 'marketplace/base.html' %}
{% load static %}

{% block title %}Add Farm - AgriGov Market{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2 class="text-center"><i class="fas fa-tractor"></i> Add New Farm</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%;">Add Farm</button>
        </form>
        <p class="text-center mt-2"><a href="/dashboard/">← Back to Dashboard</a></p>
    </div>
</div>
{% endblock %}
