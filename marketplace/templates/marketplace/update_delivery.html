{% extends 'marketplace/base.html' %}
{% block content %}
<h2>Update Delivery #{{ delivery.id }}</h2>
<p>Product: {{ delivery.order.product.name }}</p>
<p>Buyer: {{ delivery.order.buyer.username }}</p>
<p>Delivery address: {{ delivery.order.delivery_address }}</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
        {% if delivery.transporter_id %}Update Delivery{% else %}Claim and Update Delivery{% endif %}
    </button>
</form>
{% endblock %}
