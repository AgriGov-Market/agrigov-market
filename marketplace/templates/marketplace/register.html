{% extends 'marketplace/base.html' %}
{% block content %}
<h2>Register</h2>
<form method="post">
    {% csrf_token %}
    {% for field in form %}
        <div>
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <div class="errorlist">{{ field.errors }}</div>
            {% endif %}
            {% if field.help_text %}
                <small>{{ field.help_text }}</small>
            {% endif %}
        </div>
    {% endfor %}
    <button type="submit">Register</button>
</form>

<script>
    const userTypeField = document.getElementById('id_user_type');
    const capacityDiv = document.getElementById('id_capacity_kg')?.closest('div');
    const vehicleDiv = document.getElementById('id_vehicle_number')?.closest('div');

    function toggleTransporterFields() {
        if (userTypeField && userTypeField.value === 'transporter') {
            if (capacityDiv) capacityDiv.style.display = 'block';
            if (vehicleDiv) vehicleDiv.style.display = 'block';
        } else {
            if (capacityDiv) capacityDiv.style.display = 'none';
            if (vehicleDiv) vehicleDiv.style.display = 'none';
        }
    }
    if (userTypeField) {
        userTypeField.addEventListener('change', toggleTransporterFields);
        toggleTransporterFields();
    }
</script>
{% endblock %}
