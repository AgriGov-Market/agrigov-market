{% extends 'marketplace/base.html' %}
{% block content %}
<h2>Place Order for {{ product.display_name }}</h2>
{% if product.image %}
<img src="{{ product.image.url }}" alt="{{ product.display_name }}" class="product-detail-image">
{% endif %}
<p>Available: {{ product.quantity }} {{ product.unit }}</p>
<p>Price: DA {{ product.price_per_unit }}/{{ product.unit }}</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Confirm Order</button>
</form>
{% endblock %}
